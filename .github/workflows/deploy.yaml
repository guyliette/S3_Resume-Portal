name: Deploy frontend to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: terraform-frontend-75c82096

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Inspect OIDC claims
        run: |
          response=$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          token=$(jq -r '.value' <<< "${response}")
          payload=$(cut -d. -f2 <<< "${token}" | tr '_-' '/+' | base64 -d 2>/dev/null)
          jq '{iss, sub, aud}' <<< "${payload}"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::381492114267:role/github-action-access
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload frontend files
        run: |
          aws s3 sync . "s3://${S3_BUCKET}/" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".terraform/*" \
            --exclude "*.tf" \
            --exclude "*.tfstate" \
            --exclude "*.tfstate.*"
